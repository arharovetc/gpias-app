<script>
  const W = window.TelegramWidget;
  const COLORS = ['#e17076', '#7bc862', '#65aadd', '#a695e7', '#ee7aae', '#faa774'];
  let t = {};
  function parse() { try { t = JSON.parse(W.chatData) || {}; } catch (e) {} }
  function render() {
    document.getElementById('title').textContent = t.title || '';
    document.getElementById('sub').textContent = [t.when, t.format].filter(Boolean).join(' · ');
    document.getElementById('people').innerHTML =
      `<span style=&quot;display:flex&quot;>${(t.people || []).map((n, i) => `<span class=&quot;ava&quot; style=&quot;background:${COLORS[i % 6]}&quot;>${n[0]}</span>`).join('')}</span>` +
      `<span>${(t.people || []).join(', ') || 'Участники не указаны'}</span>`;
    tick();
  }
  function tick() {
    const left = Math.max(0, t.at * 1000 - Date.now());
    const d = Math.floor(left / 864e5), h = Math.floor(left / 36e5) % 24, m = Math.floor(left / 6e4) % 60;
    document.getElementById('count').innerHTML = left
      ? [[d, 'дн'], [h, 'ч'], [m, 'мин']].map(([v, u]) => `<div><b>${v}</b><small>${u}</small></div>`).join('')
      : '<div><b>🚀</b><small>Уже началось</small></div>';
    // Полоска: сколько прошло от момента отправки до поездки
    const total = t.at * 1000 - (t.sent || 0) * 1000;
    document.getElementById('bar').style.width = total > 0 ? `${Math.min(100, 100 - left / total * 100)}%` : '100%';
  }
  document.getElementById('copy').addEventListener('click', () => { W.copyText(t.address || ''); W.HapticFeedback.notificationOccurred('success'); });
  document.getElementById('route').addEventListener('click', () => W.openLink('https://yandex.ru/maps/?text=' + encodeURIComponent(t.address || '')));
  W.onEvent('chatDataChanged', () => { parse(); render(); });
  parse();
  render();
  setInterval(tick, 20000);
  W.ready();
</script>

<script>
  const W = window.TelegramWidget;
  let tasks = [];
  let done = {};
  try { tasks = JSON.parse(W.chatData) || []; } catch (e) {}
  try { done = JSON.parse(localStorage.getItem('done')) || {}; } catch (e) {}
  function render() {
    const n = tasks.filter((t, i) => done[i]).length;
    const p = tasks.length ? Math.round(n / tasks.length * 100) : 0;
    document.getElementById('ring').style.background = `conic-gradient(#1f9d55 ${p * 3.6}deg, var(--tg-theme-secondary-bg-color) 0)`;

    document.getElementById('sub').textContent = `${n} из ${tasks.length} готово`;

      `<button class=&quot;task ${done[i] ? 'done' : ''}&quot; data-i=&quot;${i}&quot;><span class=&quot;box&quot;>${done[i] ? '✓' : ''}</span>` +
      `<span class=&quot;name&quot;>${t[0]}</span><span class=&quot;due ${t[2] || ''}&quot;>${t[1] || ''}</span></button>`).join('');
    document.getElementById('party').textContent = n &amp;&amp; n === tasks.length ? '🎉 Всё сделано!' : '';
  }
  document.getElementById('list').addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    done[b.dataset.i] = !done[b.dataset.i];
    try { localStorage.setItem('done', JSON.stringify(done)); } catch (err) {}
    W.HapticFeedback.impactOccurred(done[b.dataset.i] ? 'medium' : 'light');
    render();
  });
  render();
  W.ready();
</script>

<script>
  const W = window.TelegramWidget;
  const OPTS = ['Еду', 'Пока не знаю', 'Не смогу'];

  }
  document.getElementById('opts').addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    const i = Number(b.dataset.i);
